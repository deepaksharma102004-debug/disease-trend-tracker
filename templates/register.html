<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Disease Trend Tracker</title>
    <script src="/static/js/tailwind.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: {
                background: 'oklch(0.19 0.04 260)',
                foreground: 'oklch(0.96 0.01 250)',
                card: 'oklch(0.24 0.045 260)',
                primary: 'oklch(0.68 0.14 240)',
                primaryFg: 'oklch(0.14 0.03 260)',
                mutedFg: 'oklch(0.72 0.03 250)',
                accent: 'oklch(0.78 0.12 210)',
                destructive: 'oklch(0.65 0.22 25)',
                success: 'oklch(0.72 0.14 155)',
                warning: 'oklch(0.80 0.15 75)',
                border: 'oklch(0.34 0.03 260)',
            } } }
        };
    </script>
    <link rel="stylesheet" href="/static/css/components.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-background text-foreground font-sans flex items-center justify-center px-4">

<div class="w-full max-w-md rounded-2xl border border-border bg-card shadow-[var(--shadow-card)]">

    <!-- Header (matches Doctor Login modal styling) -->
    <div class="flex items-center gap-2 px-6 py-5 border-b border-border">
        <span class="grid h-9 w-9 place-items-center rounded-lg bg-[image:var(--gradient-accent)] text-primaryFg">
            <i data-lucide="user-plus" class="h-4 w-4"></i>
        </span>
        <h2 class="font-semibold text-lg">Doctor Registration</h2>
    </div>

    <!-- Form -->
    <div class="px-6 py-6 flex flex-col items-center">

        {% if error %}
        <div class="alert alert-danger w-full max-w-[380px]">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success w-full max-w-[380px]">{{ success }}</div>
        {% endif %}

        <form method="POST" action="/register" class="w-full max-w-[380px]">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-4">
                <label class="block font-semibold text-sm mb-1 text-mutedFg">Full Name</label>
                <input type="text" name="doctor_name" class="form-control w-full"
                       placeholder="e.g. Dr. Rahul Gupta" required>
            </div>

            <div class="mb-4">
                <label class="block font-semibold text-sm mb-1 text-mutedFg">Username</label>
                <input type="text" name="username" class="form-control w-full"
                       placeholder="Choose a username" required>
            </div>

            <div class="mb-4">
                <label class="block font-semibold text-sm mb-1 text-mutedFg">Password</label>
                <input type="password" name="password" class="form-control w-full"
                       placeholder="Choose a password" required>
            </div>

            <button type="submit"
                class="w-full rounded-full bg-[image:var(--gradient-accent)] text-primaryFg font-semibold py-2.5 shadow-[var(--shadow-glow)] hover:opacity-90 transition mt-2">
                Register →
            </button>
        </form>

        <div class="w-full max-w-[380px] border-t border-border mt-6 pt-4 text-center">
            <p class="text-mutedFg text-sm mb-0">
                Already have an account?
                <a href="/" class="text-accent font-semibold">Login here</a>
            </p>
        </div>

    </div>
</div>

<script>lucide.createIcons();</script>

</body>
</html>
